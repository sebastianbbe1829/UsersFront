name: fix-review-date

on:
  push:
    branches:
      - fix/extinguishers-review-date-today

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply local-date fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('usersfront/src/pages/ExtinguisherInspectionsPage.jsx')
          text = path.read_text(encoding='utf-8')

          old = "const hoy = () => new Date().toISOString().slice(0, 10)"
          new = """const hoy = () => {
            const fecha = new Date()
            const year = fecha.getFullYear()
            const month = String(fecha.getMonth() + 1).padStart(2, '0')
            const day = String(fecha.getDate()).padStart(2, '0')
            return `${year}-${month}-${day}`
          }"""
          if old not in text:
              raise SystemExit('Fecha helper ya fue modificada o no coincide')
          text = text.replace(old, new, 1)

          old_open = """    setFormulario({
      ...FORM_INICIAL,
      extinguisherId:"""
          new_open = """    setFormulario({
      ...FORM_INICIAL,
      inspectionDate: hoy(),
      extinguisherId:"""
          if old_open not in text:
              raise SystemExit('No se encontró setFormulario de abrirNueva')
          text = text.replace(old_open, new_open, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usersfront/src/pages/ExtinguisherInspectionsPage.jsx
          git commit -m "fix: usar fecha local de hoy en nueva revisión" || exit 0
          git push
